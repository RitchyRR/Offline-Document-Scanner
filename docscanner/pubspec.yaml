name: docscanner
description: "An offline Document Scanner."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.4.5+179 # Zahl nach + ist "Versionscode", muss jedes Mal erhöht werden

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  ffi:
  # design:
  dynamic_color:
  flutter_staggered_grid_view:
  # image handling:
  path_provider:
  path:
  image_picker:
  gal: # save to gallery
  share_plus: # share files
  pdf:
  file_picker:
  image:
  receive_sharing_intent:
  # image processing:
  flutter_image_compress_lite:
  # camera:
  camera:
  camera_android_camerax:
  camera_platform_interface:
  # google:
  in_app_purchase:
  google_mobile_ads:
  # localisation:
  easy_localization:
  # other:
  provider: # NotifierProvider
  fluttertoast:
  encrypt:
  flutter_secure_storage:
  shared_preferences:
  permission_handler:
  url_launcher:
  package_info_plus:
  collection:
  pdfrx:
  crypto:
  synchronized:
  pdf_manipulator: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons:

hooks:
  user_defines:
    pdf_manipulator:
      keep: [extract]
      build: size

flutter_launcher_icons:
  android: true
  #ios: true
  image_path: "assets/icon/app_icon_363332_293037_53c5f8_00abf8_282828.png"
  adaptive_icon_background: "#00abf8"
  adaptive_icon_foreground: "assets/icon/app_icon_363332_293037_53c5f8_00abf8_282828.png"
  #dart run flutter_launcher_icons

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/lang/
    - assets/arrow.png
